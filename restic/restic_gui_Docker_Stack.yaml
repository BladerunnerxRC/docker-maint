# Restic backup GUIs — Backrest (server-level) + Stack-Back (Docker volumes)
#
# Secrets are NOT stored in this file. Provide them via:
#   • Portainer: Stack → "Environment variables" (or "Load variables from .env file")
#   • CLI:       cp .env.example .env && edit .env && docker compose up -d
# Deployment fails fast if RESTIC_PASSWORD is missing.

services:
  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    hostname: backrest
    restart: unless-stopped
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TZ:-America/New_York}
      # Repository + password are configured in the Backrest web UI; these are
      # offered for restic CLI use inside the container (docker exec backrest restic …).
      - RESTIC_REPOSITORY=${BACKREST_REPOSITORY:-/repos/optiplex/server}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env or Portainer stack variables}
    volumes:
      # Backrest state (config, oplog, cache) — must persist across recreates
      - backrest_data:/data
      - backrest_config:/config
      - backrest_cache:/cache
      # Restic repositories (NFS share mounted on the host)
      - /mnt/restic-backups:/repos
      # Paths to back up — appear under /userdata in the Backrest UI
      - /etc:/userdata/etc:ro
      - /home:/userdata/home:ro
    ports:
      - "8081:9898"          # Backrest listens on 9898
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.portainer.description=Backrest Web UI for server-level backups"
      - "com.portainer.vlan=lan"
      - "com.portainer.owner=Thomas"

  stackback:
    image: ghcr.io/lawndoc/stack-back:v1.5.4
    container_name: stackback
    restart: unless-stopped
    environment:
      - RESTIC_REPOSITORY=${STACKBACK_REPOSITORY:-/mnt/restic-backups/optiplex/docker}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env or Portainer stack variables}
      - TZ=${TZ:-America/New_York}
      # Back up volumes of every compose project, not just this stack's own
      - INCLUDE_ALL_COMPOSE_PROJECTS=true
      - AUTO_BACKUP_ALL=true
      - CRON_SCHEDULE=${STACKBACK_CRON:-0 2 * * *}
      - RESTIC_KEEP_DAILY=7
      - RESTIC_KEEP_WEEKLY=4
      - RESTIC_KEEP_MONTHLY=12
      - RESTIC_KEEP_YEARLY=3
    volumes:
      - /mnt/restic-backups:/mnt/restic-backups
      # Stack-Back talks to Docker via /tmp/docker.sock (its default DOCKER_HOST).
      # Required: it inspects containers and runs the backup jobs. Accepted risk:
      # dm-compose-lint: disable=docker-sock@stackback
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - stackback_cache:/cache   # restic cache — speeds up every run
    logging: *logging
    labels:
      - "com.portainer.description=Stack-Back for Docker volume backups"
      - "com.portainer.vlan=lan"
      - "com.portainer.owner=Thomas"

volumes:
  backrest_data:
  backrest_config:
  backrest_cache:
  stackback_cache:
  # Optional: let Docker mount the NFS share instead of a host mount at /mnt/restic-backups.
  # Define it here, then swap the /mnt/restic-backups bind mounts above for "restic_nfs:<path>".
  # restic_nfs:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: addr=192.168.200.3,nfsvers=4,rw
  #     device: :/volume1/docker_backups/OptiPlex_Docker
